<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Generar targets.mind</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f4f5f7;
      font-family:Arial,sans-serif;
      color:#161616
    }

    .card{
      width:min(720px,92vw);
      background:#fff;
      padding:28px;
      border-radius:18px;
      box-shadow:0 10px 35px rgba(0,0,0,.10)
    }

    img{
      width:min(320px,80vw);
      display:block;
      margin:20px auto;
      border-radius:12px
    }

    button{
      border:0;
      border-radius:10px;
      padding:14px 18px;
      font-size:16px;
      font-weight:700;
      cursor:pointer
    }

    button:disabled{
      opacity:.55;
      cursor:default
    }

    #barra{
      height:12px;
      background:#e9e9e9;
      border-radius:999px;
      overflow:hidden;
      margin-top:18px
    }

    #progreso{
      width:0%;
      height:100%;
      background:#222;
      transition:width .15s linear
    }

    #estado{
      margin-top:14px;
      line-height:1.45
    }

    code{
      background:#f2f2f2;
      padding:2px 5px;
      border-radius:5px
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Generar targets.mind</h1>

    <p>
      Haz esto una sola vez en la laptop.
      Luego subes <code>targets.mind</code> a GitHub.
    </p>

    <img
      id="targetImage"
      src="./target-persona.png"
      alt="Imagen objetivo"
    >

    <button id="generar">
      Generar targets.mind
    </button>

    <div id="barra">
      <div id="progreso"></div>
    </div>

    <div id="estado">
      Listo para comenzar.
    </div>

  </div>


<script>

const btn = document.querySelector("#generar");
const estado = document.querySelector("#estado");
const progreso = document.querySelector("#progreso");
const targetImage = document.querySelector("#targetImage");


function descargar(buffer) {

  const blob = new Blob(
    [buffer],
    { type: "application/octet-stream" }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "targets.mind";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);

}


btn.addEventListener("click", async () => {

  btn.disabled = true;

  progreso.style.width = "0%";

  estado.innerHTML =
    "⏳ Preparando imagen...";


  try {

    /*
      Verificamos que MindAR esté cargado.
    */

    if (
      typeof MINDAR === "undefined" ||
      !MINDAR.IMAGE ||
      !MINDAR.IMAGE.Compiler
    ) {

      throw new Error(
        "No se pudo cargar el compilador de MindAR."
      );

    }


    /*
      Esperamos a que la imagen esté realmente cargada.
    */

    if (!targetImage.complete) {

      await new Promise((resolve, reject) => {

        targetImage.onload = resolve;

        targetImage.onerror = () => {
          reject(
            new Error(
              "No se pudo cargar target-persona.png"
            )
          );
        };

      });

    }


    /*
      Creamos una copia de la imagen.

      Esto evita algunos problemas del navegador
      cuando la imagen viene directamente del DOM.
    */

    const img = new Image();

    img.src =
      "./target-persona.png?v=" + Date.now();


    await new Promise((resolve, reject) => {

      img.onload = resolve;

      img.onerror = () => {
        reject(
          new Error(
            "No se pudo leer target-persona.png"
          )
        );
      };

    });


    estado.innerHTML =
      "⚙️ Compilando imagen...";


    /*
      Creamos el compilador de MindAR.
    */

    const compiler =
      new MINDAR.IMAGE.Compiler();


    /*
      Compilamos la imagen.

      El callback devuelve el progreso
      como porcentaje.
    */

    await compiler.compileImageTargets(
      [img],

      (progress) => {

        const percent =
          Math.min(
            100,
            Math.max(
              0,
              Math.round(progress)
            )
          );

        progreso.style.width =
          percent + "%";

        estado.innerHTML =
          "⚙️ Compilando... " +
          percent +
          "%";

      }
    );


    /*
      Exportamos el resultado.
    */

    estado.innerHTML =
      "📦 Generando archivo targets.mind...";


    const exported =
      await compiler.exportData();


    if (!exported) {

      throw new Error(
        "MindAR no devolvió datos."
      );

    }


    progreso.style.width =
      "100%";


    descargar(exported);


    estado.innerHTML =
      "✅ Listo. Se descargó <b>targets.mind</b>." +
      "<br><br>" +
      "Ahora súbelo a la raíz de tu repositorio GitHub.";

  }

  catch (error) {

    console.error(error);

    estado.innerHTML =
      "❌ Error: " +
      error.message +
      "<br><br>" +
      "Abre la consola del navegador con F12 si necesitas más detalle.";

    btn.disabled = false;

  }

});

</script>

</body>
</html>
