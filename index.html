<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>WebAR Persona + Video</title>

  <!-- MindAR compiler + A-Frame integration -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #estado{position:fixed;z-index:9999;top:10px;left:10px;right:10px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.92);color:#111;text-align:center;font-size:14px}
    #progreso{font-weight:700}
  </style>
</head>
<body>
  <div id="estado">Preparando reconocimiento de imagen… <span id="progreso">0%</span></div>

  <script>
  (async () => {
    const estado = document.querySelector('#estado');
    const progreso = document.querySelector('#progreso');

    try {
      // 1) Cargar la imagen objetivo
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = './target-persona.png';
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      // 2) Compilar la imagen en el propio celular
      const compiler = new MINDAR.IMAGE.Compiler();
      await compiler.compileImageTargets([img], (p) => {
        progreso.textContent = Math.round(p) + '%';
      });
      const buffer = await compiler.exportData();
      const mindUrl = URL.createObjectURL(new Blob([buffer], {type:'application/octet-stream'}));

      estado.innerHTML = 'Abriendo cámara…';

      // 3) Crear la escena SOLO después de tener el target compilado
      const scene = document.createElement('a-scene');
      scene.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl}; autoStart: true; uiScanning: no; uiLoading: no; uiError: yes;`);
      scene.setAttribute('color-space', 'sRGB');
      scene.setAttribute('renderer', 'colorManagement: true; physicallyCorrectLights: true; alpha: true;');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
      scene.setAttribute('embedded', '');

      scene.innerHTML = `
        <a-assets timeout="15000">
          <video id="arVideo" src="./video-ar-5s.mp4" preload="auto" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
          <a-plane
            id="videoPlane"
            position="0 0 0.02"
            width="1"
            height="1.234"
            material="src: #arVideo; shader: flat; transparent: true;">
          </a-plane>
        </a-entity>
      `;

      document.body.appendChild(scene);

      scene.addEventListener('loaded', () => {
        const target = document.querySelector('#target');
        const video = document.querySelector('#arVideo');

        estado.innerHTML = '📷 Apunta la cámara a la imagen de la laptop';

        target.addEventListener('targetFound', async () => {
          estado.innerHTML = '✅ Imagen detectada · reproduciendo video';
          try {
            video.currentTime = 0;
            video.muted = true;
            await video.play();
          } catch (e) {
            estado.innerHTML = '✅ Imagen detectada · toca la pantalla para iniciar el video';
            const start = async () => {
              try { await video.play(); } catch(_) {}
              document.removeEventListener('click', start);
              document.removeEventListener('touchstart', start);
            };
            document.addEventListener('click', start, {once:true});
            document.addEventListener('touchstart', start, {once:true});
          }
        });

        target.addEventListener('targetLost', () => {
          video.pause();
          video.currentTime = 0;
          estado.innerHTML = '📷 Apunta nuevamente a la imagen';
        });

        video.addEventListener('ended', () => {
          estado.innerHTML = '✅ Video terminado · aleja y vuelve a apuntar para repetir';
        });
      });

    } catch (err) {
      console.error(err);
      estado.innerHTML = '❌ Error preparando el tracking. Recarga la página.';
    }
  })();
  </script>
</body>
</html>
