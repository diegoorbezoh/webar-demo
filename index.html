<!doctype html>
<html lang="es">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>WebAR optimizado</title>

  <!-- Precarga solo lo necesario para tracking -->
  <link
    rel="preload"
    href="./targets.mind"
    as="fetch"
    crossorigin="anonymous"
  >

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent !important;

      font-family: Arial, sans-serif;

    }

    a-scene,
    .a-canvas {

      background: transparent !important;

    }


    #videoVisual {

      position: fixed;

      width: 2px;
      height: 2px;

      left: 0;
      bottom: 0;

      opacity: 0.01;

      pointer-events: none;

    }


    #estado {

      position: fixed;

      top: max(10px, env(safe-area-inset-top));

      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 11px 14px;

      background: rgba(255,255,255,.93);

      color: #111;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      box-shadow: 0 3px 16px rgba(0,0,0,.15);

    }


    #activarAudio {

      position: fixed;

      left: 50%;
      bottom: 28px;

      transform: translateX(-50%);

      z-index: 10000;

      border: none;

      border-radius: 999px;

      padding: 14px 22px;

      font-size: 16px;
      font-weight: bold;

      background: white;

      color: #111;

      box-shadow: 0 5px 20px rgba(0,0,0,.25);

      cursor: pointer;

    }


    #activarAudio.oculto {

      display: none;

    }

  </style>

</head>



<body>


  <div id="estado">
    Abriendo cámara...
  </div>


  <button id="activarAudio">
    🔊 Activar sonido
  </button>


  <!-- Audio separado -->
  <audio
    id="audioAR"
    preload="none">
  </audio>



  <a-scene

    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      warmupTolerance: 3;
      missTolerance: 3;
    "

    embedded

    renderer="
      alpha: true;
      antialias: true;
    "

    loading-screen="enabled:false"

    vr-mode-ui="enabled:false"

    device-orientation-permission-ui="enabled:false"

  >



    <a-assets timeout="8000">

      <!--
        IMPORTANTE:
        no cargamos el mp4 al inicio
      -->

      <video

        id="videoVisual"

        preload="none"

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>

    </a-assets>



    <a-camera

      position="0 0 0"

      look-controls="enabled:false"

    ></a-camera>



    <a-entity

      id="target"

      mindar-image-target="targetIndex:0"

    >


      <a-plane

        id="videoPlane"

        visible="false"

        position="0 0 0.02"

        width="1"

        height="1.23"

        material="
          src:#videoVisual;
          shader:flat;
          side:double;
        "

      ></a-plane>


    </a-entity>


  </a-scene>



<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {


    const scene =
      document.querySelector("#scene");


    const target =
      document.querySelector("#target");


    const video =
      document.querySelector("#videoVisual");


    const audio =
      document.querySelector("#audioAR");


    const plane =
      document.querySelector("#videoPlane");


    const estado =
      document.querySelector("#estado");


    const botonAudio =
      document.querySelector("#activarAudio");


    let audioActivado = false;

    let targetVisible = false;

    let mediaCargada = false;



    /*
      =====================================
      CÁMARA COMO FONDO
      =====================================
    */


    function ajustarCamara() {


      document
        .querySelectorAll("video")
        .forEach((v) => {


          if (v.id !== "videoVisual") {


            Object.assign(
              v.style,
              {

                position: "fixed",

                top: "0",

                left: "0",

                width: "100vw",

                height: "100vh",

                objectFit: "cover",

                zIndex: "0",

                opacity: "1",

                display: "block"

              }
            );


          }


        });



      const canvas =
        document.querySelector(
          ".a-canvas"
        );


      if (canvas) {


        canvas.style.background =
          "transparent";


        canvas.style.zIndex =
          "1";


      }


    }



    /*
      =====================================
      CARGAR VIDEO DESPUÉS DE ABRIR CÁMARA
      =====================================
    */


    function cargarMedia() {


      if (mediaCargada) return;


      mediaCargada = true;


      video.src =
        "./video-ar-5s.mp4";


      audio.src =
        "./video-ar-5s.mp4";


      video.load();

      audio.load();


      console.log(
        "MP4 cargando en segundo plano"
      );


    }



    /*
      =====================================
      MINDAR LISTO
      =====================================
    */


    scene.addEventListener(
      "arReady",
      () => {


        ajustarCamara();


        setTimeout(
          ajustarCamara,
          200
        );


        setTimeout(
          ajustarCamara,
          600
        );


        estado.textContent =
          "📷 Cámara lista · apunta a la imagen";


        /*
          MUY IMPORTANTE:
          cargamos el video recién ahora
        */


        setTimeout(
          cargarMedia,
          300
        );


      }
    );



    scene.addEventListener(
      "arError",
      () => {


        estado.textContent =
          "❌ Error iniciando cámara";


      }
    );



    /*
      =====================================
      ACTIVAR AUDIO
      =====================================
    */


    botonAudio.addEventListener(
      "click",
      async () => {


        try {


          /*
            Si aún no cargamos el mp4,
            lo cargamos ahora.
          */


          cargarMedia();


          audio.volume =
            1;


          await audio.play();


          audio.pause();


          audio.currentTime =
            0;


          audioActivado =
            true;


          botonAudio.classList.add(
            "oculto"
          );


          estado.textContent =
            "✅ Sonido activado";


          if (targetVisible) {


            audio.currentTime =
              video.currentTime;


            await audio.play();


          }


        }

        catch (error) {


          console.error(
            "Error activando audio:",
            error
          );


          estado.textContent =
            "⚠️ No se pudo activar sonido";


        }


      }
    );



    /*
      =====================================
      TARGET ENCONTRADO
      =====================================
    */


    target.addEventListener(
      "targetFound",
      async () => {


        targetVisible =
          true;


        estado.textContent =
          "✅ Imagen detectada";


        /*
          Por si el target se detecta
          antes de que carguemos el video.
        */


        cargarMedia();


        try {


          video.pause();


          video.currentTime =
            0;


          video.muted =
            true;


          plane.setAttribute(
            "visible",
            true
          );


          await video.play();



          if (audioActivado) {


            audio.pause();


            audio.currentTime =
              0;


            try {


              await audio.play();


            }

            catch (e) {


              console.log(
                "Audio bloqueado:",
                e
              );


            }


          }



          const mesh =
            plane.getObject3D(
              "mesh"
            );


          if (
            mesh &&
            mesh.material &&
            mesh.material.map
          ) {


            mesh.material.map.needsUpdate =
              true;


          }



          estado.textContent =
            audioActivado
              ? "🔊 Reproduciendo video AR"
              : "▶️ Reproduciendo video AR";


        }

        catch (error) {


          console.error(
            "Error reproduciendo video:",
            error
          );


          estado.textContent =
            "⚠️ Cargando video...";


          /*
            Intento adicional después
            de una pequeña espera.
          */


          setTimeout(
            async () => {


              try {


                await video.play();


                plane.setAttribute(
                  "visible",
                  true
                );


                estado.textContent =
                  "▶️ Reproduciendo video AR";


              }

              catch (e) {


                console.error(
                  "Segundo intento:",
                  e
                );


              }


            },
            500
          );


        }


      }
    );



    /*
      =====================================
      TARGET PERDIDO
      =====================================
    */


    target.addEventListener(
      "targetLost",
      () => {


        targetVisible =
          false;


        video.pause();

        audio.pause();


        video.currentTime =
          0;


        audio.currentTime =
          0;


        plane.setAttribute(
          "visible",
          false
        );


        estado.textContent =
          "📷 Apunta nuevamente a la imagen";


      }
    );



    /*
      =====================================
      VIDEO FINALIZADO
      =====================================
    */


    video.addEventListener(
      "ended",
      () => {


        audio.pause();


        audio.currentTime =
          0;


        plane.setAttribute(
          "visible",
          false
        );


        estado.textContent =
          "✅ Video terminado";


      }
    );



    /*
      =====================================
      LOGS DE RENDIMIENTO
      =====================================
    */


    video.addEventListener(
      "loadedmetadata",
      () => {


        console.log(
          "Video listo:",
          video.videoWidth,
          "x",
          video.videoHeight
        );


      }
    );


  }
);


</script>


</body>

</html>
