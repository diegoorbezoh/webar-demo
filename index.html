<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>WebAR - Video con audio</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }

    .a-canvas {
      background: transparent !important;
    }

    /*
      Safari/iPhone:
      dejamos el elemento video técnicamente visible,
      pero con 1px y casi transparente.
    */
    #arVideo {
      position: fixed;
      width: 1px;
      height: 1px;
      left: 0;
      bottom: 0;
      opacity: 0.01;
      z-index: -1;
      pointer-events: none;
    }

    #estado {
      position: fixed;

      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 11px 14px;

      background: rgba(255,255,255,.92);

      color: #111;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      box-shadow: 0 3px 16px rgba(0,0,0,.12);
    }

    #activarAudio {
      position: fixed;

      left: 50%;
      bottom: 28px;

      transform: translateX(-50%);

      z-index: 10000;

      border: none;

      border-radius: 999px;

      padding: 14px 22px;

      font-size: 16px;
      font-weight: 700;

      background: white;
      color: #111;

      box-shadow: 0 5px 20px rgba(0,0,0,.22);

      cursor: pointer;
    }

    #activarAudio.oculto {
      display: none;
    }
  </style>
</head>

<body>

  <div id="estado">
    Abriendo cámara...
  </div>

  <button id="activarAudio">
    🔊 Activar sonido
  </button>


  <a-scene
    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    loading-screen="enabled: false"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- RECURSOS -->
    <a-assets timeout="15000">

      <video
        id="arVideo"
        src="./video-ar-5s.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>

    </a-assets>


    <!-- CÁMARA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- TARGET -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

      <!--
        VIDEO AR

        Usamos a-video directamente.
        Esto suele funcionar mejor en Safari/iPhone.
      -->
      <a-video
        id="videoPlane"

        src="#arVideo"

        visible="false"

        position="0 0 0.02"

        width="1"
        height="1.23"

        material="
          shader: flat;
          side: double;
        "
      >
      </a-video>

    </a-entity>

  </a-scene>



<script>

document.addEventListener("DOMContentLoaded", () => {

  const scene =
    document.querySelector("#scene");

  const target =
    document.querySelector("#target");

  const video =
    document.querySelector("#arVideo");

  const videoPlane =
    document.querySelector("#videoPlane");

  const estado =
    document.querySelector("#estado");

  const botonAudio =
    document.querySelector("#activarAudio");


  let audioActivado = false;



  /*
    ==========================================
    ASEGURAR VIDEO REAL DE CÁMARA COMO FONDO
    ==========================================
  */

  function asegurarFondoCamara() {

    const videos =
      document.querySelectorAll("video");


    videos.forEach((v) => {

      if (v.id !== "arVideo") {

        Object.assign(v.style, {

          position: "fixed",

          top: "0",

          left: "0",

          width: "100vw",

          height: "100vh",

          objectFit: "cover",

          zIndex: "0",

          display: "block",

          opacity: "1",

          background: "transparent"

        });

      }

    });


    const canvas =
      document.querySelector(".a-canvas");


    if (canvas) {

      canvas.style.background =
        "transparent";

      canvas.style.zIndex =
        "1";

    }

  }



  /*
    ==========================================
    MINDAR LISTO
    ==========================================
  */

  scene.addEventListener(
    "arReady",
    () => {

      asegurarFondoCamara();

      setTimeout(
        asegurarFondoCamara,
        300
      );

      setTimeout(
        asegurarFondoCamara,
        1000
      );

      estado.textContent =
        "📷 Activa sonido y apunta a la imagen";

    }
  );



  scene.addEventListener(
    "arError",
    () => {

      estado.textContent =
        "❌ No se pudo iniciar la cámara";

    }
  );



  /*
    ==========================================
    DESBLOQUEAR AUDIO Y VIDEO EN IOS
    ==========================================
  */

  botonAudio.addEventListener(
    "click",
    async () => {

      try {

        /*
          Importante en iOS:
          este play ocurre como consecuencia directa
          de un toque del usuario.
        */

        video.muted = false;
        video.volume = 1;

        await video.play();


        /*
          Dejamos correr unos milisegundos para que
          Safari inicialice correctamente el video.
        */

        await new Promise(
          resolve =>
            setTimeout(resolve, 100)
        );


        video.pause();

        video.currentTime = 0;


        audioActivado = true;


        botonAudio.classList.add(
          "oculto"
        );


        estado.textContent =
          "✅ Sonido activado · apunta a la imagen";


      }

      catch (error) {

        console.error(
          "Error activando video/audio:",
          error
        );


        estado.textContent =
          "⚠️ No se pudo activar el video";

      }

    }
  );



  /*
    ==========================================
    TARGET DETECTADO
    ==========================================
  */

  target.addEventListener(
    "targetFound",
    async () => {

      estado.textContent =
        "✅ Imagen detectada";


      try {

        video.pause();

        video.currentTime = 0;


        /*
          Audio según estado.
        */

        if (audioActivado) {

          video.muted = false;
          video.volume = 1;

        }

        else {

          video.muted = true;

        }


        /*
          Primero mostramos el plano.
        */

        videoPlane.setAttribute(
          "visible",
          true
        );


        /*
          Después reproducimos.
        */

        await video.play();


        /*
          Forzamos actualización de textura.
          Ayuda especialmente en Safari.
        */

        const mesh =
          videoPlane.getObject3D("mesh");


        if (
          mesh &&
          mesh.material &&
          mesh.material.map
        ) {

          mesh.material.map.needsUpdate =
            true;

        }


        estado.textContent =
          audioActivado
            ? "🔊 Reproduciendo video AR"
            : "🔇 Reproduciendo video AR";


      }

      catch (error) {

        console.error(
          "Error reproduciendo video:",
          error
        );


        estado.textContent =
          "⚠️ No se pudo reproducir el video";

      }

    }
  );



  /*
    ==========================================
    TARGET PERDIDO
    ==========================================
  */

  target.addEventListener(
    "targetLost",
    () => {

      video.pause();

      video.currentTime = 0;


      videoPlane.setAttribute(
        "visible",
        false
      );


      estado.textContent =
        "📷 Apunta nuevamente a la imagen";

    }
  );



  /*
    ==========================================
    VIDEO TERMINADO
    ==========================================
  */

  video.addEventListener(
    "ended",
    () => {

      videoPlane.setAttribute(
        "visible",
        false
      );


      estado.textContent =
        "✅ Video terminado";

    }
  );



  /*
    ==========================================
    DIAGNÓSTICO
    ==========================================
  */

  video.addEventListener(
    "loadedmetadata",
    () => {

      console.log(
        "Video cargado:",
        video.videoWidth,
        "x",
        video.videoHeight,
        "duración:",
        video.duration
      );

    }
  );


  video.addEventListener(
    "error",
    () => {

      console.error(
        "Error cargando MP4:",
        video.error
      );


      estado.textContent =
        "❌ Error cargando video-ar-5s.mp4";

    }
  );


});

</script>


</body>
</html>
