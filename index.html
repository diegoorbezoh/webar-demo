<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>WebAR - Perrito saltando</title>


  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent !important;

    }


    canvas,
    .a-canvas {

      background: transparent !important;

    }


    .mensaje {

      position: fixed;

      top: 10px;
      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 10px 14px;

      background: rgba(255,255,255,.90);

      color: #111;

      border-radius: 12px;

      font-family: Arial, sans-serif;

      text-align: center;

      font-size: 14px;

    }

  </style>

</head>



<body>


  <div class="mensaje">

    Apunta al marcador HIRO 🐶

  </div>



  <a-scene

    embedded

    vr-mode-ui="enabled:false"

    renderer="
      alpha:true;
      antialias:true;
      logarithmicDepthBuffer:true;
    "

    arjs="
      sourceType:webcam;
      debugUIEnabled:false;
      detectionMode:mono;
    "

  >



    <!-- IMÁGENES / RECURSOS -->

    <a-assets>


      <!--
      Debes subir una imagen llamada perrito.png
      al mismo repositorio.

      Idealmente debe tener fondo transparente.
      -->

      <img
        id="dog"
        src="perrito.png"
      >


    </a-assets>



    <!-- MARCADOR -->

    <a-marker preset="hiro">



      <!--
      Contenedor principal
      -->

      <a-entity

        position="0 0 0"

        rotation="-90 0 0"

      >



        <!--
        SOMBRA DEL PERRITO
        -->

        <a-circle

          radius="0.38"

          position="0 0 -0.02"

          material="
            color:#000000;
            opacity:0.22;
            transparent:true;
          "

          scale="1 0.35 1"

        >

        </a-circle>



        <!--
        PERRITO
        -->

        <a-image

          src="#dog"

          width="1"

          height="1"

          position="0 0 0.1"


          animation="
            property: position;
            from: 0 0 0.1;
            to: 0 0.75 0.1;
            dir: alternate;
            dur: 550;
            loop: true;
            easing: easeOutQuad;
          "


          animation__rotate="
            property: rotation;
            from: 0 0 -7;
            to: 0 0 7;
            dir: alternate;
            dur: 550;
            loop: true;
            easing: easeInOutSine;
          "


          animation__scale="
            property: scale;
            from: 1 1 1;
            to: 1.08 0.94 1;
            dir: alternate;
            dur: 550;
            loop: true;
            easing: easeInOutQuad;
          "

        >

        </a-image>



      </a-entity>



    </a-marker>



    <!-- CÁMARA -->

    <a-entity camera></a-entity>



  </a-scene>


</body>

</html>
