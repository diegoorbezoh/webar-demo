<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>WebAR Chispa NFT</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    canvas,
    .a-canvas {
      background: transparent !important;
    }

    #estado {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      padding: 12px;
      background: rgba(255,255,255,.92);
      border-radius: 12px;
      font-family: Arial, sans-serif;
      text-align: center;
      font-size: 14px;
    }
  </style>

  <script>
    AFRAME.registerComponent("chispa-nft", {
      init: function () {
        const nft = this.el;
        const estado = document.querySelector("#estado");

        nft.addEventListener("markerFound", function () {
          estado.innerHTML = "✅ Chispa detectada";

          const foto = document.querySelector("#chispaAR");

          foto.setAttribute("scale", "0.01 0.01 0.01");
          foto.emit("aparecer");
        });

        nft.addEventListener("markerLost", function () {
          estado.innerHTML = "🐶 Apunta la cámara a la foto de Chispa";
        });
      }
    });
  </script>
</head>

<body>

  <div id="estado">
    🐶 Apunta la cámara a la foto de Chispa
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="
      alpha:true;
      antialias:true;
      logarithmicDepthBuffer:true;
    "
    arjs="
      sourceType:webcam;
      debugUIEnabled:false;
      trackingMethod:best;
    "
  >

    <a-assets>
      <img
        id="chispa"
        src="chispa.png"
      >
    </a-assets>

    <a-nft
      type="nft"
      url="chispa"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
      chispa-nft
    >

      <a-image
        id="chispaAR"
        src="#chispa"

        width="120"
        height="160"

        position="0 0 0"

        rotation="-90 0 0"

        scale="0.01 0.01 0.01"

        animation__scale="
          property: scale;
          from: 0.01 0.01 0.01;
          to: 1 1 1;
          dur: 900;
          easing: easeOutElastic;
          startEvents: aparecer;
        "

        animation__subir="
          property: position;
          from: 0 0 0;
          to: 0 0 35;
          dur: 900;
          easing: easeOutQuad;
          startEvents: aparecer;
        "

        animation__giro="
          property: rotation;
          from: -90 0 -12;
          to: -90 0 8;
          dur: 900;
          easing: easeInOutQuad;
          startEvents: aparecer;
        "
      >
      </a-image>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
