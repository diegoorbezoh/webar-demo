<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <title>WebAR - Video + Audio</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent !important;

      font-family: Arial, sans-serif;

    }


    a-scene,
    .a-canvas {

      background: transparent !important;

    }


    /*
      VIDEO VISUAL

      Siempre permanece muted.
      Safari puede usarlo como textura WebGL
      sin restricciones de autoplay.
    */

    #videoVisual {

      position: fixed;

      width: 2px;
      height: 2px;

      left: 0;
      bottom: 0;

      opacity: 0.01;

      pointer-events: none;

    }


    #estado {

      position: fixed;

      top: max(10px, env(safe-area-inset-top));

      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 11px 14px;

      background: rgba(255,255,255,.93);

      color: #111;

      border-radius: 12px;

      text-align: center;

      font-size: 14px;

      box-shadow: 0 3px 16px rgba(0,0,0,.15);

    }


    #activarAudio {

      position: fixed;

      left: 50%;
      bottom: 28px;

      transform: translateX(-50%);

      z-index: 10000;

      border: none;

      border-radius: 999px;

      padding: 14px 22px;

      font-size: 16px;

      font-weight: bold;

      background: white;

      color: #111;

      box-shadow: 0 5px 20px rgba(0,0,0,.25);

      cursor: pointer;

    }


    #activarAudio.oculto {

      display: none;

    }

  </style>

</head>



<body>


  <div id="estado">

    Abriendo cámara...

  </div>



  <button id="activarAudio">

    🔊 Activar sonido

  </button>



  <!--
    AUDIO INDEPENDIENTE

    Utilizamos el mismo MP4,
    pero este elemento únicamente maneja sonido.
  -->

  <audio
    id="audioAR"
    src="./video-ar-5s.mp4"
    preload="auto">
  </audio>



  <a-scene

    id="scene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      warmupTolerance: 5;
      missTolerance: 5;
    "

    embedded

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    loading-screen="enabled:false"

    vr-mode-ui="enabled:false"

    device-orientation-permission-ui="enabled:false"

  >



    <!-- RECURSOS -->

    <a-assets timeout="15000">


      <!--
        IMPORTANTE:

        Este video SIEMPRE está muted.
        Nunca lo desmuteamos.
      -->

      <video

        id="videoVisual"

        src="./video-ar-5s.mp4"

        preload="auto"

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>


    </a-assets>



    <!-- CÁMARA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled:false"

    ></a-camera>



    <!-- TARGET -->

    <a-entity

      id="target"

      mindar-image-target="targetIndex:0"

    >



      <!-- VIDEO SUPERPUESTO -->

      <a-plane

        id="videoPlane"

        visible="false"

        position="0 0 0.02"

        width="1"

        height="1.23"

        material="
          src:#videoVisual;
          shader:flat;
          side:double;
        "

      ></a-plane>



    </a-entity>


  </a-scene>



<script>


document.addEventListener(
  "DOMContentLoaded",
  () => {


    const scene =
      document.querySelector("#scene");


    const target =
      document.querySelector("#target");


    const video =
      document.querySelector("#videoVisual");


    const audio =
      document.querySelector("#audioAR");


    const plane =
      document.querySelector("#videoPlane");


    const estado =
      document.querySelector("#estado");


    const botonAudio =
      document.querySelector("#activarAudio");


    let audioActivado = false;

    let targetVisible = false;



    /*
      ====================================
      VIDEO DE CÁMARA COMO FONDO
      ====================================
    */


    function ajustarCamara() {


      document
        .querySelectorAll("video")
        .forEach((v) => {


          /*
            Ignoramos nuestro video AR.
          */

          if (v.id !== "videoVisual") {


            Object.assign(
              v.style,
              {

                position: "fixed",

                top: "0",

                left: "0",

                width: "100vw",

                height: "100vh",

                objectFit: "cover",

                zIndex: "0",

                opacity: "1",

                display: "block"

              }
            );


          }


        });



      const canvas =
        document.querySelector(
          ".a-canvas"
        );


      if (canvas) {


        canvas.style.background =
          "transparent";


        canvas.style.zIndex =
          "1";


      }


    }



    /*
      ====================================
      MINDAR LISTO
      ====================================
    */


    scene.addEventListener(
      "arReady",
      () => {


        ajustarCamara();


        setTimeout(
          ajustarCamara,
          300
        );


        setTimeout(
          ajustarCamara,
          1000
        );


        estado.textContent =
          "📷 Apunta a la imagen";


      }
    );



    scene.addEventListener(
      "arError",
      () => {


        estado.textContent =
          "❌ Error iniciando cámara";


      }
    );



    /*
      ====================================
      ACTIVAR AUDIO

      Aquí SOLO desbloqueamos <audio>.
      No tocamos el video AR.
      ====================================
    */


    botonAudio.addEventListener(
      "click",
      async () => {


        try {


          audio.volume = 1;


          /*
            Safari necesita que play()
            ocurra como consecuencia directa
            del toque del usuario.
          */


          await audio.play();


          /*
            Lo detenemos inmediatamente.

            Ya quedó desbloqueado.
          */


          audio.pause();


          audio.currentTime = 0;


          audioActivado = true;


          botonAudio.classList.add(
            "oculto"
          );


          estado.textContent =
            "✅ Sonido activado · apunta a la imagen";


          /*
            Si el target ya estaba siendo visto
            cuando activamos audio,
            empezamos el sonido sincronizado.
          */


          if (targetVisible) {


            audio.currentTime =
              video.currentTime;


            await audio.play();


          }


        }

        catch (error) {


          console.error(
            "Error desbloqueando audio:",
            error
          );


          estado.textContent =
            "⚠️ No se pudo activar sonido";


        }


      }
    );



    /*
      ====================================
      TARGET DETECTADO
      ====================================
    */


    target.addEventListener(
      "targetFound",
      async () => {


        targetVisible = true;


        estado.textContent =
          "✅ Imagen detectada";


        /*
          Reiniciamos video visual.
        */


        video.pause();

        video.currentTime = 0;


        /*
          MUY IMPORTANTE:

          El video visual SIEMPRE muted.
        */


        video.muted = true;


        /*
          Mostramos plano AR.
        */


        plane.setAttribute(
          "visible",
          true
        );


        try {


          /*
            Este autoplay debería funcionar
            porque el video está muted.
          */


          await video.play();



          /*
            Si el audio está habilitado,
            lo iniciamos al mismo tiempo.
          */


          if (audioActivado) {


            audio.pause();

            audio.currentTime = 0;


            try {


              await audio.play();


            }

            catch (audioError) {


              console.log(
                "Audio bloqueado:",
                audioError
              );


            }


          }



          /*
            Forzar actualización de textura.
          */


          const mesh =
            plane.getObject3D(
              "mesh"
            );


          if (
            mesh &&
            mesh.material &&
            mesh.material.map
          ) {


            mesh.material.map.needsUpdate =
              true;


          }



          estado.textContent =
            audioActivado
              ? "🔊 Reproduciendo video AR"
              : "▶️ Reproduciendo video AR";


        }

        catch (error) {


          console.error(
            "Error reproduciendo video:",
            error
          );


          plane.setAttribute(
            "visible",
            false
          );


          estado.textContent =
            "❌ Error reproduciendo video";


        }


      }
    );



    /*
      ====================================
      TARGET PERDIDO
      ====================================
    */


    target.addEventListener(
      "targetLost",
      () => {


        targetVisible = false;


        video.pause();

        audio.pause();


        video.currentTime = 0;

        audio.currentTime = 0;


        plane.setAttribute(
          "visible",
          false
        );


        estado.textContent =
          "📷 Apunta nuevamente a la imagen";


      }
    );



    /*
      ====================================
      VIDEO TERMINADO
      ====================================
    */


    video.addEventListener(
      "ended",
      () => {


        audio.pause();

        audio.currentTime = 0;


        plane.setAttribute(
          "visible",
          false
        );


        estado.textContent =
          "✅ Video terminado";


      }
    );



    /*
      ====================================
      DIAGNÓSTICO
      ====================================
    */


    video.addEventListener(
      "loadedmetadata",
      () => {


        console.log(
          "VIDEO:",
          video.videoWidth,
          "x",
          video.videoHeight,
          "duración:",
          video.duration
        );


      }
    );


  }
);


</script>


</body>

</html>
