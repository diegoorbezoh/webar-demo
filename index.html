<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>WebAR - Chispa</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    canvas,
    .a-canvas {
      background: transparent !important;
    }

    .mensaje {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 10px;

      background: rgba(255,255,255,.9);

      border-radius: 12px;

      font-family: Arial, sans-serif;
      text-align: center;
    }
  </style>

  <script>

    AFRAME.registerComponent("chispa-animation", {

      init: function () {

        const marker = this.el;

        marker.addEventListener("markerFound", () => {

          const foto = document.querySelector("#chispaAR");

          /*
            Reiniciamos la animación cada vez
            que se detecta la foto.
          */

          foto.setAttribute("scale", "0.05 0.05 0.05");
          foto.setAttribute("position", "0 0.1 0");
          foto.setAttribute("rotation", "-90 0 -12");

          foto.emit("chispaStart");

        });

      }

    });

  </script>

</head>

<body>

  <div class="mensaje">
    Apunta la cámara a la imagen de Chispa 🐶
  </div>


  <a-scene

    embedded

    vr-mode-ui="enabled:false"

    renderer="
      alpha:true;
      antialias:true;
      logarithmicDepthBuffer:true;
    "

    arjs="
      sourceType:webcam;
      debugUIEnabled:false;
      detectionMode:mono;
    "

  >


    <a-assets>

      <img
        id="chispa"
        src="chispa.png"
      >

    </a-assets>



    <!-- MARCADOR PERSONALIZADO -->

    <a-marker

      type="pattern"

      url="pattern-chispa.patt"

      chispa-animation

    >


      <!--
        FOTO DE CHISPA QUE APARECE EN AR
      -->

      <a-image

        id="chispaAR"

        src="#chispa"

        width="0.78"

        height="1"

        position="0 0.1 0"

        rotation="-90 0 0"

        scale="0.05 0.05 0.05"


        animation__scale="
          property: scale;
          from: 0.05 0.05 0.05;
          to: 1 1 1;
          dur: 900;
          easing: easeOutElastic;
          startEvents: chispaStart;
        "


        animation__position="
          property: position;
          from: 0 0.1 0;
          to: 0 0.55 0;
          dur: 1000;
          easing: easeOutQuad;
          startEvents: chispaStart;
        "


        animation__rotation="
          property: rotation;
          from: -90 0 -12;
          to: -90 0 8;
          dur: 1100;
          easing: easeInOutSine;
          startEvents: chispaStart;
        "

      >

      </a-image>


    </a-marker>


    <a-entity camera></a-entity>


  </a-scene>

</body>
</html>
