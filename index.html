<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>WebAR - Perrito 3D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- animation-mixer para reproducir animaciones GLB -->
  <script src="https://cdn.jsdelivr.net/gh/n5ro/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    canvas,
    .a-canvas {
      background: transparent !important;
    }

    .mensaje {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;

      z-index: 9999;

      padding: 10px 14px;

      background: rgba(255, 255, 255, 0.9);
      color: #111;

      border-radius: 12px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="mensaje">
    Apunta la cámara al marcador HIRO 🐶
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"

    renderer="
      alpha: true;
      antialias: true;
      logarithmicDepthBuffer: true;
    "

    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono;
    "
  >

    <!-- RECURSOS -->
    <a-assets>

      <a-asset-item
        id="dogModel"
        src="perrito-3d-animado.glb">
      </a-asset-item>

    </a-assets>


    <!-- MARCADOR HIRO -->
    <a-marker preset="hiro">


      <!-- PERRITO 3D -->
      <a-entity
        id="dog"

        gltf-model="#dogModel"

        animation-mixer="
          clip: Jump;
          loop: repeat;
          repetitions: Infinity;
          timeScale: 1;
        "

        position="0 0 0.2"

        rotation="0 0 0"

        scale="0.45 0.45 0.45"
      >
      </a-entity>


      <!-- SOMBRA SIMPLE -->
      <a-circle
        position="0 0.01 0"
        rotation="-90 0 0"

        radius="0.35"

        material="
          color: #000000;
          opacity: 0.20;
          transparent: true;
        "

        scale="1 0.45 1">
      </a-circle>


    </a-marker>


    <!-- CÁMARA -->
    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
