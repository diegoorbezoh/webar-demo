<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Imagen objetivo WebAR</title>
  <style>
    body{margin:0;min-height:100vh;background:#f4f5f7;font-family:Arial,sans-serif;display:grid;place-items:center}
    .wrap{width:min(1050px,94vw);display:grid;grid-template-columns:1.45fr .65fr;gap:28px;align-items:center}
    .card{background:#fff;padding:26px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.1);text-align:center}
    .target{width:min(58vw,540px);max-width:100%;border-radius:8px}
    .qr{width:min(28vw,250px);max-width:100%}
    h1{margin-top:0}
    p{line-height:1.45}
    @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Imagen objetivo</h1>
      <p>Después de abrir la WebAR, apunta la cámara a esta imagen.</p>
      <img class="target" src="./target-persona.png" alt="Imagen objetivo">
    </section>

    <section class="card">
      <h2>Escanea el QR</h2>
      <img class="qr" src="./qr-webar.png" alt="QR WebAR">
      <p><b>1.</b> Abre el enlace<br>
      <b>2.</b> Permite la cámara<br>
      <b>3.</b> Apunta a la imagen</p>
    </section>
  </main>
</body>
</html>
