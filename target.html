<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Imagen objetivo WebAR</title>
  <style>
    body{margin:0;min-height:100vh;background:#f4f4f4;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
    .wrap{width:min(1100px,94vw);display:grid;grid-template-columns:1.4fr .65fr;gap:28px;align-items:center}
    .card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 35px rgba(0,0,0,.12);text-align:center}
    .target{width:min(60vw,520px);max-width:100%;display:block;margin:auto}
    .qr{width:min(26vw,250px);max-width:100%}
    h1{margin:0 0 8px} p{line-height:1.4;color:#333}
    @media(max-width:760px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Imagen objetivo</h1>
      <p>Después de abrir la cámara WebAR, apunta a esta imagen.</p>
      <img class="target" src="./target-persona.png" alt="Imagen objetivo">
    </section>
    <section class="card">
      <h2>Escanea con tu celular</h2>
      <img class="qr" src="./qr-webar.png" alt="QR WebAR">
      <p><b>1.</b> Escanea el QR<br><b>2.</b> Permite la cámara<br><b>3.</b> Apunta a la imagen</p>
    </section>
  </main>
</body>
</html>
