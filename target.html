<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Imagen objetivo - WebAR</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:#f6f6f6;font-family:system-ui,sans-serif
    }
    .wrap{text-align:center}
    img{
      width:min(72vw,72vh);max-width:720px;
      background:#fff;padding:24px;box-sizing:border-box;
      box-shadow:0 8px 30px rgba(0,0,0,.12)
    }
    p{max-width:620px;margin:16px auto 0;color:#333}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Marcador HIRO">
    <p>Deja esta imagen visible en la laptop. Abre <b>/index.html</b> en tu celular y apunta la cámara aquí.</p>
  </div>
</body>
</html>
