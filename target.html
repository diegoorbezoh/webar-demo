<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Demo WebAR</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(1050px, 94vw);
      display: grid;
      grid-template-columns: 1.4fr .7fr;
      gap: 30px;
      align-items: center;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .target {
      width: min(55vw, 520px);
      max-width: 100%;
      border-radius: 10px;
    }

    .qr {
      width: min(25vw, 250px);
      max-width: 100%;
    }

    h1 {
      margin-top: 0;
    }

    p {
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <section class="card">

      <h1>Imagen objetivo</h1>

      <p>
        Después de abrir la WebAR en el celular,
        apunta la cámara a esta imagen.
      </p>

      <img
        class="target"
        src="./target-persona.png"
        alt="Imagen objetivo"
      >

    </section>


    <section class="card">

      <h2>Escanea este QR</h2>

      <img
        class="qr"
        src="./qr-webar.png"
        alt="QR WebAR"
      >

      <p>
        <b>1.</b> Escanea el QR<br><br>
        <b>2.</b> Abre el enlace<br><br>
        <b>3.</b> Permite la cámara<br><br>
        <b>4.</b> Apunta a la imagen
      </p>

    </section>

  </main>

</body>
</html>
